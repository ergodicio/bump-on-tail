[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bump-on-tail"
version = "0.2.0"
description = "Reproduce the kinetic-closure figures in the PPCF manuscript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8"]

[project.optional-dependencies]
compute = ["jax>=0.5.3,<0.6", "equinox>=0.12.2,<0.13", "optax>=0.2.8,<0.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.setuptools.package-data]
bot = ["data/*.npz", "data/*.json", "models/*.eqx", "assets/*.png", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
